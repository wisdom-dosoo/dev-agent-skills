name: ci
on:
  push:
  pull_request:
  workflow_dispatch: # manual re-run from the Actions tab (no empty commit needed)
  schedule:
    - cron: "0 8 1 * *" # monthly: catches stale snapshots even without PRs
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck \
            web-app-development/web-app-development/scripts/preflight.sh \
            web-app-development/web-app-development/evals/check-fixtures.sh \
            cross-platform-mobile/cross-platform-mobile/scripts/preflight.sh \
            cross-platform-mobile/cross-platform-mobile/evals/check-fixtures.sh \
            security-review/security-review/scripts/secrets-scan.sh \
            security-review/security-review/evals/check-fixtures.sh \
            devops-delivery/devops-delivery/scripts/container-check.sh \
            devops-delivery/devops-delivery/evals/check-fixtures.sh \
            quality-assurance/quality-assurance/scripts/test-check.sh \
            quality-assurance/quality-assurance/evals/check-fixtures.sh \
            frontend-excellence/frontend-excellence/scripts/frontend-check.sh \
            frontend-excellence/frontend-excellence/evals/check-fixtures.sh \
            install.sh \
            scripts/check-house-style.sh
      - name: house-style gate (CONTRIBUTING.md Decisions 1-3)
        run: bash scripts/check-house-style.sh
      - name: fixture suites (all skills with fixtures)
        run: |
          for s in web-app-development cross-platform-mobile security-review devops-delivery quality-assurance frontend-excellence; do
            echo "== $s =="
            bash $s/$s/evals/check-fixtures.sh || exit 1
          done
      - name: snapshot freshness
        run: |
          for f in */*/references/current-state.md; do
            d=$(grep -oE 'Snapshot date: [0-9]{4}-[0-9]{2}-[0-9]{2}' "$f" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
            age=$(( ($(date +%s) - $(date -d "$d" +%s)) / 86400 ))
            echo "$f: snapshot $d ($age days old)"
            if [ "$age" -gt 60 ]; then echo "::error::$f snapshot is $age days old (>60). Refresh current-state.md."; exit 1; fi
            if [ "$age" -gt 30 ]; then echo "::warning::$f snapshot is $age days old (>30). Refresh soon."; fi
          done
